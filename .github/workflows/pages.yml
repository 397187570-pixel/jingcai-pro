name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare static site (deploy source as-is, skip Vite build)
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r css config js ml _site/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # 双托管：若仓库设置了 VERCEL_TOKEN 等密钥，则同时部署到 Vercel（jingcai-seven.vercel.app）。
  # 注意：secrets 上下文不能用于 job 级 if（会导致整个 workflow 判为非法），
  # 因此在 job 级 env 中转，再在步骤级 if 用 env 判断；未设置密钥时自动跳过。
  deploy-vercel:
    needs: build
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Vercel
        if: ${{ env.VERCEL_TOKEN != '' }}
        run: |
          npm i -g vercel
          vercel deploy --prod --token "$VERCEL_TOKEN" --yes
